# 渲染英文站并发布到本仓库的 GitHub Pages。不访问中文站服务器。
name: Publish English site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - theme.js
      - downloads.js
      - i18n.js
      - LICENSE-icons.txt
      - robots.txt
      - sitemap.xml
      - public/**
      - scripts/render-english-site.mjs
      - scripts/assemble-english-site.mjs
      - scripts/site-files.txt
      - .github/workflows/publish-english-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: english-site
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble English site
        run: node scripts/assemble-english-site.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

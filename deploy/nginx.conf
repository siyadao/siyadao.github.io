# 思芽岛宣传页使用独立虚拟主机，不修改主站、控制台或 API。
server {
    listen 80;
    listen [::]:80;
    server_name studio.siyadao.cn;

    access_log /var/log/nginx/siyadao-studio.access.log;
    error_log /var/log/nginx/siyadao-studio.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://studio.siyadao.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.siyadao.cn;

    ssl_certificate /etc/letsencrypt-studio/live/studio.siyadao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-studio/live/studio.siyadao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SiyadaoStudioSSL:1m;
    ssl_session_timeout 10m;

    root /var/www/siyadao-studio/current;
    index index.html;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/siyadao-studio.access.log;
    error_log /var/log/nginx/siyadao-studio.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # 文件名不含内容哈希，更新时必须重新验证缓存。
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }
}

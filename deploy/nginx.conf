# 思芽岛宣传页使用独立虚拟主机，不修改主站、控制台或 API。
# 官方版本 API 与旧客户端元数据按需缓存；不转发客户端凭据，不启动轮询。
proxy_cache_path /var/cache/nginx/siyadao-releases levels=1:2 keys_zone=SiyadaoReleases:1m max_size=10m inactive=1d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name studio.siyadao.cn;

    access_log /var/log/nginx/siyadao-studio.access.log;
    error_log /var/log/nginx/siyadao-studio.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://studio.siyadao.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.siyadao.cn;

    ssl_certificate /etc/letsencrypt-studio/live/studio.siyadao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-studio/live/studio.siyadao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SiyadaoStudioSSL:1m;
    ssl_session_timeout 10m;

    root /var/www/siyadao-studio/current;
    index index.html;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/siyadao-studio.access.log;
    error_log /var/log/nginx/siyadao-studio.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # 文件名不含内容哈希，更新时必须重新验证缓存。
    add_header Cache-Control "no-cache";

    # 保留旧客户端升级入口，原 GitHub 元数据协议与缓存策略不变。
    location = /api/releases {
        limit_except GET { deny all; }
        # 固定上游、路径及参数，不接受用户传入的代理目标或认证信息。
        proxy_pass https://api.github.com/repos/siyadao/studio/releases?per_page=20;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent siyadao-public-downloads;
        proxy_set_header Accept application/vnd.github+json;
        proxy_set_header Content-Length "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_cache SiyadaoReleases;
        proxy_cache_key "siyadao-public-releases-20";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 8s;
        proxy_cache_lock_age 10s;
        proxy_cache_valid 200 2m;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header X-Release-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location = /api/app/releases {
        limit_except GET { deny all; }
        # 固定上游、路径及参数，不接受用户传入的代理目标或认证信息。
        proxy_pass http://127.0.0.1:8081/v1/app/releases?;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host studioapi.siyadao.cn;
        proxy_set_header User-Agent siyadao-public-downloads;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_cache SiyadaoReleases;
        proxy_cache_key "siyadao-app-releases-v1";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 8s;
        proxy_cache_lock_age 10s;
        proxy_cache_valid 200 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header X-Release-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }
}
